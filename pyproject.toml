[project]
name = "modular-tokenization"
version = "0.1.0"
description = "To Each Language Its Tokenizer: modular tokenizers (sequential BPE, merged Unigram) with extractable, composable per-language subtokenizers, and multilingual LM training on sampled sub-vocabularies"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "numpy",
    "tokenizers>=0.20",
    "transformers>=4.44",
    "sentencepiece>=0.2.0",
    "protobuf",
    "pydantic>=2",
    "omegaconf",
    "tqdm",
]

[dependency-groups]
# language-model training/evaluation stack, installed by default (uv sync);
# tokenizer-only users can skip it with: uv sync --no-group lm
lm = [
    "jax[cuda12]",
    "flax",
    "jaxtyping",
    "optax",
    "orbax-checkpoint",
    "flash-attn3-jax",
    "sacrebleu",
    "rouge-score",
]

[tool.uv]
exclude-newer = "7 days"
default-groups = ["lm"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["modular_tokenizers", "modular_lm"]
