[project]
name = "modular-tokenization"
version = "0.1.0"
description = "To Each Language Its Tokenizer: modular tokenizers (sequential BPE, merged Unigram) with extractable, composable per-language subtokenizers, and multilingual LM training on sampled sub-vocabularies"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "numpy",
    "tokenizers>=0.20",
    "transformers>=4.44",
    "sentencepiece>=0.2.0",
    "protobuf",
    "pydantic>=2",
    "omegaconf",
    "tqdm",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["modular_tokenizers", "modular_lm"]
